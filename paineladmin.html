<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrador</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

<!-- TOP -->
<h1>Painel Administrador | Sair</h1>

<!-- RESUMO -->
<div class="stats">

    <div class="card">
        <h2>24</h2>
        <p>Restaurantes registados</p>
    </div>

    <div class="card">
        <h2>156</h2>
        <p>Clientes registados
    <div class="card">
        <h2>42</h2>
        <p>Encomendas hoje</p>
    </div>

</div>

<h2>Gestão de Restaurantes</h2>

<table id="tabelaRestaurantes">
    <tr>
        <th>Restaurante</th>
        <th>ID</th>
        <th>Ações</th>
    </tr>
</table>

<script>
fetch("gerirRestaurantes.php")
.then(res => res.json())
.then(dados => {
    const tabela = document.getElementById("tabelaRestaurantes");

    dados.forEach(r => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${r.nome}</td>
            <td>${r.idRestaurante}</td>
            <td>
                <button onclick="remover(${r.idRestaurante})" class="btn-remover">
                    Remover
                </button>
            </td>
        `;

        tabela.appendChild(row);
    });
});

function remover(id) {
    window.location.href = "gerirRestaurantes.php?delete=" + id;
}
</script>
<h2>Gestão de Utilizadores</h2>

<table id="tabelaUtilizadores">
    <tr>
        <th>Username</th>
        <th>Tipo</th>
        <th>Ações</th>
    </tr>
</table>

<script>
fetch("gerirUtilizadores.php")
.then(res => res.json())
.then(dados => {
    const tabela = document.getElementById("tabelaUtilizadores");

    dados.forEach(u => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${u.username}</td>
            <td>${u.tipo}</td>
            <td>
                <button onclick="removerUser(${u.idUtilizador})" class="btn-remover">
                    Remover
                </button>
            </td>
        `;

        tabela.appendChild(row);
    });
});

function removerUser(id) {
    window.location.href = "gerirUtilizadores.php?delete=" + id;
}
</script>
