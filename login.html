<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Registo - FoodToGo</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<script>
    const params = new URLSearchParams(window.location.search);
    const registo = params.get("registo");

    if (registo === "sucesso") {
        alert("Conta criada com sucesso. Já pode iniciar sessão.");
        window.history.replaceState({}, document.title, "login.html");
    }

    if (registo === "campos") {
        alert("Preencha todos os campos do registo.");
        window.history.replaceState({}, document.title, "login.html");
    }

    if (registo === "email_invalido") {
        alert("O email inserido não é válido.");
        window.history.replaceState({}, document.title, "login.html");
    }

    if (registo === "duplicado") {
        alert("O username ou email já existe.");
        window.history.replaceState({}, document.title, "login.html");
    }

    if (registo === "erro") {
        alert("Ocorreu um erro ao criar a conta.");
        window.history.replaceState({}, document.title, "login.html");
    }
</script>
<body class="pagina-login">
<header>
    <div class="logo">Food<span>ToGo</span></div>
    <nav>
        <a href="index.html">Home</a>
        <a href="restaurantes.php">Restaurantes</a>
        <a href="carrinho.php">Carrinho (<span data-cart-count>0</span>)</a>
    </nav>
</header>
<section class="auth-section">
    <div class="auth-box">
        <h2>Entrar</h2>
        <form action="scripts/login.php" method="POST">
            <label>Username ou Email</label>
            <input type="text" name="login" placeholder="Username ou email" required>
            <label>Palavra-passe</label>
            <input type="password" name="password" placeholder="A sua palavra-passe" required>
            <div class="auth-buttons"><button type="submit" class="btn-primary">Entrar</button></div>
        </form>
        <p class="small">Testes: admin/admin123, restaurante/rest123, cliente/cliente123</p>
    </div>
    <div class="auth-box">
        <h2>Criar Conta</h2>
        <form action="scripts/novoregisto.php" method="POST">
            <label>Nome</label><input type="text" name="nome" required>
            <label>Username</label><input type="text" name="username" required>
            <label>Email</label><input type="email" name="email" required>
            <label>Palavra-passe</label><input type="password" name="password" required>
            <div class="auth-buttons"><button type="submit" class="btn-secondary">Criar Conta</button></div>
            <p class="small">Novas contas são criadas como cliente. O admin pode alterar o estatuto para restaurante.</p>
        </form>
    </div>
</section>
<footer><p>© 2026 FoodToGo</p><div class="social"><span>Facebook</span><span>Instagram</span><span>Twitter</span></div></footer>
<script src="scripts/app.js"></script>
</body>
</html>
