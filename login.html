<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login / Registo - FoodToGo</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">Food<span>ToGo</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="restaurantes.html">Restaurantes</a>
        <a href="login.html">Login/Registo</a>
    </nav>
</header>

<!-- FORM CONTAINER -->
<section class="auth-section">

    <div class="auth-box">
        <h2>Entrar ou Criar Conta</h2>

        <form>

            <label>Nome</label>
            <input type="text" placeholder="O seu nome">

            <label>Email</label>
            <input type="email" placeholder="O seu email">

            <label>Palavra-passe</label>
            <input type="password" placeholder="A sua palavra-passe">

            <label>Tipo de conta</label>
            <select>
                <option>Cliente</option>
                <option>Restaurante</option>
            </select>

            <div class="auth-buttons">
                <button class="btn-primary">Entrar</button>
                <button type="button" class="btn-secondary">Criar Conta</button>
            </div>

        </form>
    </div>

</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 FoodToGo</p>

    <div class="social">
        <span>Facebook</span>
        <span>Instagram</span>
        <span>Twitter</span>
    </div>
</footer>

</body>
</html>
